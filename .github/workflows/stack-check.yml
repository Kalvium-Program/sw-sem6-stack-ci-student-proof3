name: Stack check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Throwaway value for this practice stack. Not a real password.
      DB_PASSWORD: ci-only-not-secret
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm Docker Compose is available
        run: docker compose version

      - name: Start the stack and wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test through Nginx
        run: curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8095/api/events

      - name: Save service logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps > compose-logs.txt
          docker compose logs --no-color app proxy

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down --remove-orphans
